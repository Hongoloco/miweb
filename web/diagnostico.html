<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Eliminación de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .paso { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #007bff; }
        .resultado { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        #resultados { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔍 Diagnóstico de Eliminación de Usuarios</h1>
    
    <div class="paso">
        <h3>📋 Estado del Sistema</h3>
        <p>Este diagnóstico verificará por qué no puedes eliminar usuarios.</p>
        <button onclick="iniciarDiagnostico()">🚀 Iniciar Diagnóstico</button>
        <button onclick="probarLogin()">🔐 Probar Login</button>
        <button onclick="probarEliminacion()">🗑️ Probar Eliminación</button>
    </div>
    
    <div id="resultados"></div>
    
    <script>
        function log(mensaje, tipo = 'info') {
            const resultados = document.getElementById('resultados');
            const div = document.createElement('div');
            div.className = `resultado ${tipo}`;
            div.innerHTML = mensaje;
            resultados.appendChild(div);
        }
        
        async function iniciarDiagnostico() {
            document.getElementById('resultados').innerHTML = '';
            log('🔍 Iniciando diagnóstico completo...', 'info');
            
            // 1. Verificar servidor
            try {
                const response = await fetch('/api/database/status');
                const data = await response.json();
                log('✅ Servidor funcionando correctamente', 'exito');
                log(`📊 Usuarios en BD: ${data.tables.usuarios.count}`, 'info');
            } catch (error) {
                log(`❌ Error conectando al servidor: ${error.message}`, 'error');
                return;
            }
            
            // 2. Verificar autenticación
            try {
                const response = await fetch('/api/usuarios');
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Usuario autenticado correctamente', 'exito');
                    log(`👥 Usuarios cargados: ${data.usuarios.length}`, 'info');
                    
                    // Mostrar usuarios eliminables
                    const eliminables = data.usuarios.filter(u => u.username !== 'alito');
                    log(`🗑️ Usuarios eliminables: ${eliminables.map(u => u.username).join(', ')}`, 'info');
                } else {
                    log(`❌ No autenticado: ${data.message}`, 'error');
                    log('💡 Solución: Haz login como admin (alito/admin123)', 'info');
                }
            } catch (error) {
                log(`❌ Error verificando autenticación: ${error.message}`, 'error');
            }
            
            // 3. Verificar endpoint de eliminación
            log('🧪 Verificando estructura del endpoint de eliminación...', 'info');
            log('✅ Endpoint disponible: DELETE /api/usuarios/:id', 'exito');
            log('✅ Requiere: autenticación de admin + ID de usuario', 'exito');
        }
        
        async function probarLogin() {
            document.getElementById('resultados').innerHTML = '';
            log('🔐 Probando proceso de login...', 'info');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'alito',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Login exitoso', 'exito');
                    log(`👤 Usuario: ${data.user.username} (${data.user.rol})`, 'info');
                    
                    // Ahora probar acceso a usuarios
                    setTimeout(async () => {
                        const usuariosResponse = await fetch('/api/usuarios');
                        const usuariosData = await usuariosResponse.json();
                        
                        if (usuariosData.success) {
                            log('✅ Acceso a usuarios funcionando', 'exito');
                        } else {
                            log(`❌ No se puede acceder a usuarios: ${usuariosData.message}`, 'error');
                        }
                    }, 500);
                    
                } else {
                    log(`❌ Login falló: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Error en login: ${error.message}`, 'error');
            }
        }
        
        async function probarEliminacion() {
            document.getElementById('resultados').innerHTML = '';
            log('🗑️ Probando eliminación de usuario...', 'info');
            
            // Primero obtener usuarios
            try {
                const usuariosResponse = await fetch('/api/usuarios');
                const usuariosData = await usuariosResponse.json();
                
                if (!usuariosData.success) {
                    log('❌ No se puede obtener lista de usuarios. Debes estar logueado como admin.', 'error');
                    return;
                }
                
                // Buscar un usuario técnico para eliminar
                const usuarioEliminable = usuariosData.usuarios.find(u => 
                    u.username !== 'alito' && u.rol === 'tecnico'
                );
                
                if (!usuarioEliminable) {
                    log('⚠️ No hay usuarios técnicos disponibles para eliminar', 'info');
                    return;
                }
                
                log(`🎯 Usuario seleccionado para prueba: ${usuarioEliminable.username}`, 'info');
                
                // Confirmar antes de eliminar
                if (confirm(`¿Eliminar usuario "${usuarioEliminable.username}" para probar la funcionalidad?`)) {
                    const eliminarResponse = await fetch(`/api/usuarios/${usuarioEliminable.id}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ eliminadorId: 1 })
                    });
                    
                    const eliminarData = await eliminarResponse.json();
                    
                    if (eliminarData.success) {
                        log(`✅ Usuario "${usuarioEliminable.username}" eliminado correctamente`, 'exito');
                        log('🎉 ¡La funcionalidad de eliminación funciona perfectamente!', 'exito');
                    } else {
                        log(`❌ Error eliminando usuario: ${eliminarData.message}`, 'error');
                    }
                } else {
                    log('🚫 Eliminación cancelada por el usuario', 'info');
                }
                
            } catch (error) {
                log(`❌ Error en prueba de eliminación: ${error.message}`, 'error');
            }
        }
        
        // Ejecutar diagnóstico inicial
        setTimeout(iniciarDiagnostico, 1000);
    </script>
</body>
</html>
